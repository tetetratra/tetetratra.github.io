<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, noimageindex"><meta name="theme-color" content="#f5f5ef">
<title>Knowledge</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script>
</head>
<body>
<header><a class="brand" href="./" aria-label="Knowledge ホーム"><span>k.</span>Knowledge</a><a class="legacy" href="/knowledge/">一覧版 ↗</a></header>
<main>
<div class="search-wrap"><form role="search" id="search-form"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="search">ページを探す</label><input id="search" type="search" placeholder="ページを探す" autocomplete="off"><kbd>/</kbd></form><div id="search-results" hidden></div></div>
<section id="graph" aria-label="知識のグラフ。ドラッグで移動、ピンチまたは拡大ボタンで詳しく表示" tabindex="0"><canvas aria-hidden="true"></canvas><div id="nodes"></div></section>
<div class="overview"><span class="dot"></span><span id="level">参照 3件以上</span><span id="visible-count"></span></div>
<div class="tools"><button id="home" type="button" aria-label="全体に戻る" title="全体に戻る">⌂</button><div class="zoom-tools"><button id="zoom-out" type="button" aria-label="縮小">−</button><output id="zoom">100%</output><button id="zoom-in" type="button" aria-label="拡大">＋</button></div></div>
<p id="hint">ドラッグで移動 <span>·</span> 拡大すると、より細かなページが現れます</p>
<div id="loading" role="status">読み込み中…</div>
<aside id="detail" aria-label="ページの内容" hidden><div class="detail-top"><span id="detail-kind"></span><button id="close-detail" aria-label="内容を閉じる" type="button">×</button></div><h1 id="detail-title"></h1><div id="detail-body"></div><p id="preview-note" hidden>既存ノートの冒頭から抜粋</p><div id="detail-links"></div><div class="detail-footer"><span id="detail-count"></span><button id="focus" type="button">関連を見渡す ↗</button></div></aside>
</main>
</body></html>
